<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The LiveAgents mark, inline and identical to the console's own.
      A data URI rather than a file: the same two circles the console draws, so
      the tab beside it matches exactly, with no extra request and no second
      copy of an asset to keep in step.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2335D07F' opacity='.2'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='%2335D07F'/%3E%3C/svg%3E"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Parabolic Agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
